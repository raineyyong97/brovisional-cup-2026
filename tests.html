<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sync tests — Brovisional Championship</title>
<style>
  :root{ --green-900:#0B3D2E; --green-700:#14573f; --cream:#F7F3E8; --gold:#C9A227;
         --white:#fff; --line:#dcd6c4; --muted:#7a7361; --fail:#B3261E; }
  *{box-sizing:border-box}
  body{margin:0;padding:28px 20px;background:var(--cream);color:var(--green-900);
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
  #summary{padding:14px 18px;border-radius:10px;font-weight:600;margin-bottom:18px;
           background:var(--green-900);color:var(--cream);}
  #summary.bad{background:var(--fail);}
  .case{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--green-700);
        padding:10px 14px;margin-bottom:7px;border-radius:6px;font-size:14px;}
  .case.fail{border-left-color:var(--fail);}
  .case .name{font-weight:600;}
  .case .why{font-family:ui-monospace,'JetBrains Mono',monospace;font-size:12px;
             color:var(--fail);margin-top:5px;white-space:pre-wrap;}
  .tag{float:right;font-size:11px;letter-spacing:.06em;color:var(--muted);}
  .case.fail .tag{color:var(--fail);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sync layer tests</h1>
  <div class="sub">Pure merge, queue, and hydration logic. No network, no framework.</div>
  <div id="summary">Running…</div>
  <div id="results"></div>
</div>

<script type="module">
import {
  isNewer, scoreKey, playerKey, coalesceOutbox,
  toDbStrokes, fromDbStrokes,
  applyRemoteScore, applyRemotePlayer,
  statusText, createSync, createClock
} from './sync.js';

// Tests register here and run sequentially below. Sequential matters: several
// cases seed and clear localStorage, so overlapping runs would clobber each other.
const cases = [];
const results = [];
function test(name, fn){ cases.push({name, fn}); }
function eq(actual, expected, label){
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if(a !== b) throw new Error(`${label||'expected'}\n  got:      ${a}\n  expected: ${b}`);
}
function ok(cond, label){ if(!cond) throw new Error(label || 'expected truthy'); }

// Fresh in-memory state shaped like the real app's.
function freshState(){
  const SCORES = {0:{}, 1:{}, 2:{}, 3:{}};
  const PLAYERS = [{name:'Rainey', hi:12.4}, {name:'Marcus', hi:8.1}];
  for(const d of [0,1,2,3]) for(const p of PLAYERS) SCORES[d][p.name] = Array(18).fill('');
  return {SCORES, PLAYERS, versions:{}};
}

// --- the merge rule --------------------------------------------------------

test('a newer write beats an older one', () => {
  ok(isNewer({updated_at:2000, device:'a'}, {updated_at:1000, device:'a'}));
});

test('a stale write loses — the offline-replay guard', () => {
  ok(!isNewer({updated_at:1000, device:'a'}, {updated_at:2000, device:'b'}));
});

test('any write beats an absent one', () => {
  ok(isNewer({updated_at:1, device:'a'}, undefined));
});

test('identical timestamps resolve deterministically by device', () => {
  const x = {updated_at:5000, device:'aaa'}, y = {updated_at:5000, device:'bbb'};
  ok(isNewer(y, x), 'bbb should beat aaa');
  ok(!isNewer(x, y), 'and the comparison must not be symmetric');
});

test('a device never loses to itself on an equal timestamp', () => {
  ok(!isNewer({updated_at:5000, device:'a'}, {updated_at:5000, device:'a'}));
});

// --- outbox ----------------------------------------------------------------

test('coalescing collapses repeated edits to one cell', () => {
  const q = [1,2,3,4,5].map(i => ({key:'s|0|Rainey|3', updated_at:1000+i, device:'a', strokes:i}));
  const out = coalesceOutbox(q);
  eq(out.length, 1, 'five taps should cost one write');
  eq(out[0].strokes, 5, 'the last tap should win');
});

test('coalescing keeps distinct cells separate', () => {
  const out = coalesceOutbox([
    {key:'s|0|Rainey|3', updated_at:1000, device:'a'},
    {key:'s|0|Marcus|3', updated_at:1001, device:'a'},
    {key:'s|1|Rainey|3', updated_at:1002, device:'a'}
  ]);
  eq(out.length, 3);
});

test('coalescing emits oldest-first so replay order is stable', () => {
  const out = coalesceOutbox([
    {key:'b', updated_at:3000, device:'a'},
    {key:'a', updated_at:1000, device:'a'},
    {key:'c', updated_at:2000, device:'a'}
  ]);
  eq(out.map(e=>e.key), ['a','c','b']);
});

// --- applying remote rows --------------------------------------------------

test('a remote row lands in memory', () => {
  const s = freshState();
  ok(applyRemoteScore(s, {day:0, player:'Rainey', hole:3, strokes:5, updated_at:1000, device:'b'}));
  eq(s.SCORES[0]['Rainey'][3], '5');
});

test('a remote update does not discard a newer pending local edit', () => {
  const s = freshState();
  // local edit at t=2000, still sitting in the outbox
  s.SCORES[0]['Rainey'][3] = '4';
  s.versions[scoreKey(0,'Rainey',3)] = {updated_at:2000, device:'me'};
  // an older row arrives from another phone
  const changed = applyRemoteScore(s, {day:0, player:'Rainey', hole:3, strokes:9, updated_at:1000, device:'them'});
  ok(!changed, 'stale remote row should be rejected');
  eq(s.SCORES[0]['Rainey'][3], '4', 'the local edit must survive');
});

test('offline replay does not regress a newer remote value', () => {
  const s = freshState();
  // phone was offline and queued hole 3 = 4 at t=1000
  const queued = {key:scoreKey(0,'Rainey',3), updated_at:1000, device:'me'};
  // meanwhile another phone wrote 6 at t=2000, which we pulled on reconnect
  applyRemoteScore(s, {day:0, player:'Rainey', hole:3, strokes:6, updated_at:2000, device:'them'});
  eq(s.SCORES[0]['Rainey'][3], '6');
  // the queued entry now flushes — server and client must both reject it
  ok(!isNewer(queued, s.versions[scoreKey(0,'Rainey',3)]), 'replayed stale entry must lose');
});

test('remote rows for unknown days or players are ignored, not thrown', () => {
  const s = freshState();
  ok(!applyRemoteScore(s, {day:9, player:'Rainey', hole:3, strokes:5, updated_at:1, device:'b'}));
  ok(!applyRemoteScore(s, {day:0, player:'Nobody', hole:3, strokes:5, updated_at:1, device:'b'}));
  ok(!applyRemotePlayer(s, {name:'Nobody', hi:10, updated_at:1, device:'b'}));
});

test('a remote handicap change lands on the right player', () => {
  const s = freshState();
  ok(applyRemotePlayer(s, {name:'Marcus', hi:7.2, updated_at:1000, device:'b'}));
  eq(s.PLAYERS.find(p=>p.name==='Marcus').hi, 7.2);
  eq(s.PLAYERS.find(p=>p.name==='Rainey').hi, 12.4, 'other players untouched');
});

test('supabase ISO timestamps compare correctly against local epoch ms', () => {
  const s = freshState();
  s.versions[scoreKey(0,'Rainey',3)] = {updated_at: Date.parse('2026-07-31T10:00:00Z'), device:'me'};
  ok(applyRemoteScore(s, {day:0, player:'Rainey', hole:3, strokes:5,
                          updated_at:'2026-07-31T10:00:01Z', device:'them'}), 'one second later should win');
  ok(!applyRemoteScore(s, {day:0, player:'Rainey', hole:3, strokes:8,
                           updated_at:'2026-07-31T09:59:59Z', device:'them'}), 'one second earlier should lose');
});

// --- the clock -------------------------------------------------------------

test('taps in the same millisecond still get increasing timestamps', () => {
  const clock = createClock(() => 1000);          // a stopped wall clock
  eq([clock(), clock(), clock()], [1000, 1001, 1002]);
});

test('a clock stepping backwards mid-round cannot make new edits lose', () => {
  let wall = 5000;
  const clock = createClock(() => wall);
  const first = clock();
  wall = 3000;                                     // NTP correction jumps back 2s
  const second = clock();
  ok(second > first, 'the later edit must still win');
});

// --- value encoding --------------------------------------------------------

test('blank scores round-trip through the DB as null', () => {
  eq(toDbStrokes(''), null);
  eq(toDbStrokes(null), null);
  eq(toDbStrokes(undefined), null);
  eq(fromDbStrokes(null), '');
});

test('gross scores round-trip as strings, which is what SCORES holds', () => {
  eq(toDbStrokes('7'), 7);
  eq(fromDbStrokes(7), '7');
  eq(fromDbStrokes(toDbStrokes('12')), '12');
});

// --- status ----------------------------------------------------------------

test('status text reflects what the player actually needs to know', () => {
  eq(statusText({online:true,  live:true,  pending:0}), 'Live');
  eq(statusText({online:true,  live:false, pending:0}), 'Saved');
  eq(statusText({online:false, live:false, pending:0}), 'Offline');
  eq(statusText({online:false, live:false, pending:3}), 'Offline — 3 pending');
  eq(statusText({online:true,  live:true,  pending:2}), 'Syncing… 2');
});

// --- hydration -------------------------------------------------------------

test('localStorage hydration produces the shape the render functions expect', async () => {
  localStorage.clear();
  localStorage.setItem('phuket-golf-snapshot', JSON.stringify({
    SCORES: {0:{Rainey:['4','5','', '', '','','','','','','','','','','','','','']}},
    PLAYERS: [{name:'Rainey', hi:11.0}],
    versions: {}
  }));
  const s = freshState();
  const sync = createSync({SCORES:s.SCORES, PLAYERS:s.PLAYERS, config:{url:'',anonKey:''}});
  await sync.start();
  eq(s.SCORES[0]['Rainey'][0], '4');
  eq(s.SCORES[0]['Rainey'][1], '5');
  eq(s.SCORES[0]['Rainey'].length, 18, 'must stay an 18-element array');
  eq(s.PLAYERS.find(p=>p.name==='Rainey').hi, 11.0);
  eq(s.SCORES[0]['Marcus'].length, 18, 'players absent from the snapshot keep their empty card');
  localStorage.clear();
});

test('scores saved by the pre-sync version of the app are picked up once', async () => {
  localStorage.clear();
  localStorage.setItem('phuket-golf-scores', JSON.stringify({
    0:{Marcus:['6','','','','','','','','','','','','','','','','','']}
  }));
  localStorage.setItem('phuket-golf-players', JSON.stringify([{name:'Marcus', hi:9.9}]));
  const s = freshState();
  const sync = createSync({SCORES:s.SCORES, PLAYERS:s.PLAYERS, config:{url:'',anonKey:''}});
  await sync.start();
  eq(s.SCORES[0]['Marcus'][0], '6', 'legacy scores should survive the upgrade');
  eq(s.PLAYERS.find(p=>p.name==='Marcus').hi, 9.9);
  localStorage.clear();
});

test('a local edit queues, versions the cell, and survives reload', async () => {
  localStorage.clear();
  const s = freshState();
  const sync = createSync({SCORES:s.SCORES, PLAYERS:s.PLAYERS, config:{url:'',anonKey:''}});
  await sync.start();
  sync.recordScore(0, 'Rainey', 3, '5');
  eq(sync._outbox().length, 1, 'the edit should be queued');
  ok(sync.state.versions[scoreKey(0,'Rainey',3)], 'the cell should be versioned');
  const persisted = JSON.parse(localStorage.getItem('phuket-golf-outbox'));
  eq(persisted.length, 1, 'the outbox must survive a reload');
  eq(persisted[0].strokes, 5);
  localStorage.clear();
});

test('rapid stepper taps collapse to a single queued write', async () => {
  localStorage.clear();
  const s = freshState();
  const sync = createSync({SCORES:s.SCORES, PLAYERS:s.PLAYERS, config:{url:'',anonKey:''}});
  await sync.start();
  for(const v of ['4','5','6','7']) sync.recordScore(0, 'Rainey', 3, v);
  eq(sync._outbox().length, 1);
  eq(sync._outbox()[0].strokes, 7);
  localStorage.clear();
});

// --- report ----------------------------------------------------------------

(async function run(){
  // Several cases seed and clear localStorage. On the origin the real app is
  // served from, that would wipe a round in progress — so snapshot and restore.
  const backup = {...localStorage};
  try {
    for(const c of cases){
      try { await c.fn(); results.push({name:c.name, ok:true}); }
      catch(err){ results.push({name:c.name, ok:false, why:err.message}); }
    }
  } finally {
    localStorage.clear();
    for(const k of Object.keys(backup)) localStorage.setItem(k, backup[k]);
  }
  const failed = results.filter(r => !r.ok);
  const sum = document.getElementById('summary');
  sum.textContent = failed.length
    ? `${failed.length} failing of ${results.length}`
    : `All ${results.length} tests passing`;
  if(failed.length) sum.classList.add('bad');
  document.getElementById('results').innerHTML = results.map(r => `
    <div class="case ${r.ok ? '' : 'fail'}">
      <span class="tag">${r.ok ? 'PASS' : 'FAIL'}</span>
      <span class="name">${r.name}</span>
      ${r.why ? `<div class="why">${r.why.replace(/</g,'&lt;')}</div>` : ''}
    </div>`).join('');
  window.__testsDone = true;
  window.__testsFailed = failed.length;
})();
</script>
</body>
</html>
